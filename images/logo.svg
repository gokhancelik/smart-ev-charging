<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#29B6F6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#81D4FA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="170" fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#4FC3F7" stroke-width="1" opacity="0.15"/>

  <line x1="256" y1="95" x2="256" y2="390" stroke="#4FC3F7" stroke-width="1" opacity="0.2"/>

  <!-- mdi:car-electric -->
  <g filter="url(#glow)" transform="translate(102, 181)">
    <svg viewBox="0 0 24 24" width="150" height="150">
      <path d="M18.92 2C18.72 1.42 18.16 1 17.5 1H6.5C5.84 1 5.29 1.42 5.08 2L3 8V16C3 16.55 3.45 17 4 17H5C5.55 17 6 16.55 6 16V15H18V16C18 16.55 18.45 17 19 17H20C20.55 17 21 16.55 21 16V8L18.92 2M6.5 12C5.67 12 5 11.33 5 10.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12M17.5 12C16.67 12 16 11.33 16 10.5S16.67 9 17.5 9 19 9.67 19 10.5 18.33 12 17.5 12M5 7L6.5 2.5H17.5L19 7H5M7 20H11V18L17 21H13V23L7 20Z" fill="url(#iconGrad)"/>
    </svg>
  </g>

  <!-- mdi:ev-station -->
  <g filter="url(#glow)" transform="translate(260, 181)">
    <svg viewBox="0 0 24 24" width="150" height="150">
      <path d="M19.77,7.23L19.78,7.22L16.06,3.5L15,4.56L17.11,6.67C16.17,7.03 15.5,7.93 15.5,9A2.5,2.5 0 0,0 18,11.5C18.36,11.5 18.69,11.42 19,11.29V18.5A1,1 0 0,1 18,19.5A1,1 0 0,1 17,18.5V14A2,2 0 0,0 15,12H14V5A2,2 0 0,0 12,3H6A2,2 0 0,0 4,5V21H14V13.5H15.5V18.5A2.5,2.5 0 0,0 18,21A2.5,2.5 0 0,0 20.5,18.5V9C20.5,8.31 20.22,7.68 19.77,7.23M18,10A1,1 0 0,1 17,9A1,1 0 0,1 18,8A1,1 0 0,1 19,9A1,1 0 0,1 18,10M8,18V13.5H6L10,6V11H12L8,18Z" fill="url(#iconGrad)"/>
    </svg>
  </g>

  <!-- price graph line -->
  <g filter="url(#lineGlow)" transform="translate(256, 350)">
    <polyline points="-150,12 -120,-12 -90,8 -55,-18 -20,5 15,-28 50,10 85,-14 120,12 150,0"
              fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-120" cy="-12" r="2.5" fill="#81D4FA" opacity="0.6"/>
    <circle cx="-55" cy="-18" r="2.5" fill="#81D4FA" opacity="0.6"/>
    <circle cx="15" cy="-28" r="3.5" fill="#4FC3F7"/>
    <circle cx="85" cy="-14" r="2.5" fill="#81D4FA" opacity="0.6"/>
  </g>
</svg>
