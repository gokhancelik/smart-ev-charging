########################################################################
# Smart EV Charging — Core Package
#
# This package provides all helpers, template sensors, statistics
# accumulators, and the notification-action listener used by the
# "Smart EV Charging" blueprint automation.
#
# Entity configuration (which vehicle/charger/price entities to use) is
# handled by the companion custom_components/smart_ev_charging integration
# via its config flow — install and set that up first (Settings > Devices
# & Services > + Add Integration > Smart EV Charging). It exposes the
# entities you pick under stable, well-known entity IDs
# (sensor.ev_charging_price, binary_sensor.ev_vehicle_connected,
# binary_sensor.ev_charging_active, binary_sensor.ev_price_cheap,
# sensor.ev_battery_percentage, sensor.ev_charging_power,
# sensor.ev_energy_meter, sensor.ev_smart_charging_config), which is what
# every template below reads. This package does not read your raw
# integration entities directly.
#
# Requires in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
#   script: !include_dir_merge_named scripts
#
# All input_* helpers automatically restore their last state across
# Home Assistant restarts (RestoreEntity), so an in-progress charging
# session's start time/energy/price survive a restart safely.
########################################################################

input_text:
  # --- Debug helpers (see "Debug section" of the dashboard) ---
  ev_last_notification_action:
    name: "EV Debug: Last Notification Action"
    icon: mdi:bell-ring
    max: 255

  ev_last_charging_decision:
    name: "EV Debug: Last Charging Decision"
    icon: mdi:text-box-search
    max: 255

  ev_last_session_summary:
    name: "EV Debug: Last Session Summary"
    icon: mdi:file-document-outline
    max: 255

########################################################################
# MODE / FEATURE TOGGLES
########################################################################
input_boolean:
  # Core helper required by spec: "follow_price" — smart charging mode.
  # ON  = wait for cheap electricity before charging (Smart mode)
  # OFF = charge immediately whenever plugged in (Manual mode)
  ev_follow_price:
    name: "EV Smart Charging Enabled"
    icon: mdi:transmission-tower

  # Session-only override set by the "Charge now" notification button.
  # Automatically reset to off the next time the vehicle is unplugged.
  ev_charge_now_override:
    name: "EV Charge Now (this session only)"
    icon: mdi:lightning-bolt

  # Momentary "pulse" helper used to request an immediate stop from a
  # script/dashboard/notification button. The blueprint resets it back
  # to off after acting on it.
  ev_stop_charging_requested:
    name: "EV Stop Charging Request (internal)"
    icon: mdi:stop-circle

  # Authoritative "is a charging session currently being tracked" flag.
  # More reliable than checking input_datetime for emptiness, since
  # input_datetime cannot be cleared back to "unknown" once set.
  ev_session_tracking:
    name: "EV Session Tracking Active (internal)"
    icon: mdi:record-circle-outline

  ev_target_battery_enabled:
    name: "EV Stop At Target Battery %"
    icon: mdi:battery-charging-80

  ev_max_price_enabled:
    name: "EV Enforce Maximum Price"
    icon: mdi:cash-remove

  ev_quiet_hours_enabled:
    name: "EV Quiet Hours Enabled"
    icon: mdi:sleep

  ev_low_battery_emergency_enabled:
    name: "EV Low Battery Emergency Charging"
    icon: mdi:battery-alert

  ev_debug_logging:
    name: "EV Debug Logging"
    icon: mdi:bug

########################################################################
# NUMERIC SETTINGS & ACCUMULATORS
########################################################################
input_number:
  # Core helpers required by spec
  ev_charge_start_energy:
    name: "EV Charge Start Energy"
    icon: mdi:counter
    min: 0
    max: 1000
    step: 0.01
    unit_of_measurement: kWh
    mode: box

  ev_charge_start_price:
    name: "EV Charge Start Price"
    icon: mdi:currency-eur
    min: -1
    max: 5
    step: 0.001
    mode: box

  # --- Nice-to-have configuration ---
  ev_target_battery_percentage:
    name: "EV Target Battery Percentage"
    icon: mdi:battery-charging-80
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    initial: 80

  ev_battery_capacity_kwh:
    name: "EV Battery Capacity (for cost estimates)"
    icon: mdi:car-battery
    min: 0
    max: 200
    step: 0.5
    unit_of_measurement: kWh
    mode: box
    initial: 0

  ev_max_acceptable_price:
    name: "EV Maximum Acceptable Price"
    icon: mdi:cash-remove
    min: -1
    max: 5
    step: 0.001
    mode: box
    initial: 0.30

  ev_low_battery_threshold:
    name: "EV Low Battery Emergency Threshold"
    icon: mdi:battery-alert
    min: 1
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    initial: 15

  # --- Lifetime statistics accumulators (updated by ev_log_charging_session) ---
  ev_lifetime_energy_kwh:
    name: "EV Lifetime Energy (internal)"
    icon: mdi:counter
    min: 0
    max: 1000000
    step: 0.01
    unit_of_measurement: kWh
    mode: box
    initial: 0

  ev_lifetime_cost:
    name: "EV Lifetime Cost (internal)"
    icon: mdi:cash
    min: 0
    max: 1000000
    step: 0.01
    mode: box
    initial: 0

  ev_lifetime_duration_minutes:
    name: "EV Lifetime Charging Duration (internal)"
    icon: mdi:timer-outline
    min: 0
    max: 100000000
    step: 1
    unit_of_measurement: min
    mode: box
    initial: 0

########################################################################
# TIME SETTINGS
########################################################################
input_datetime:
  # Core helper required by spec
  ev_charge_start_time:
    name: "EV Charge Start Time"
    icon: mdi:clock-start
    has_date: true
    has_time: true

  ev_quiet_hours_start:
    name: "EV Quiet Hours Start"
    icon: mdi:clock-time-ten
    has_date: false
    has_time: true
    initial: "22:00:00"

  ev_quiet_hours_end:
    name: "EV Quiet Hours End"
    icon: mdi:clock-time-six
    has_date: false
    has_time: true
    initial: "06:00:00"

  ev_departure_time:
    name: "EV Departure Time"
    icon: mdi:clock-alert-outline
    has_date: false
    has_time: true
    initial: "07:30:00"

########################################################################
# SESSION COUNTER
########################################################################
counter:
  ev_charging_sessions_total:
    name: "EV Charging Sessions Total"
    icon: mdi:counter
    initial: 0
    step: 1
    restore: true

########################################################################
# UTILITY METERS — automatically derive today / this week / this month
# statistics from the lifetime accumulator sensors below. Home Assistant
# resets these on its own schedule; no automation logic needed.
########################################################################
utility_meter:
  ev_charging_cost_daily:
    source: sensor.ev_charging_lifetime_cost
    cycle: daily
  ev_charging_cost_weekly:
    source: sensor.ev_charging_lifetime_cost
    cycle: weekly
  ev_charging_cost_monthly:
    source: sensor.ev_charging_lifetime_cost
    cycle: monthly
  ev_charging_energy_daily:
    source: sensor.ev_charging_lifetime_energy
    cycle: daily
  ev_charging_energy_weekly:
    source: sensor.ev_charging_lifetime_energy
    cycle: weekly
  ev_charging_energy_monthly:
    source: sensor.ev_charging_lifetime_energy
    cycle: monthly

########################################################################
# TEMPLATE SENSORS
########################################################################
template:
  - sensor:
      # ---------------------------------------------------------------
      # Current charging mode: Smart / Manual (session override) / Manual
      # ---------------------------------------------------------------
      - name: "EV Charging Mode"
        unique_id: ev_charging_mode
        icon: >-
          {% if is_state('input_boolean.ev_follow_price', 'on') and is_state('input_boolean.ev_charge_now_override', 'off') %}
            mdi:transmission-tower
          {% else %}
            mdi:hand-back-right
          {% endif %}
        state: >-
          {% if is_state('input_boolean.ev_charge_now_override', 'on') %}
            Manual (session override)
          {% elif is_state('input_boolean.ev_follow_price', 'on') %}
            Smart
          {% else %}
            Manual
          {% endif %}

      # ---------------------------------------------------------------
      # Current charging state: Disconnected / Waiting / Ready / Charging
      # ---------------------------------------------------------------
      - name: "EV Charging State"
        unique_id: ev_charging_state
        icon: >-
          {% if is_state('binary_sensor.ev_charging_active', 'off') %}
            mdi:power-plug-off
          {% else %}
            mdi:battery-charging
          {% endif %}
        state: >-
          {% set connected = is_state('binary_sensor.ev_vehicle_connected', 'on') %}
          {% set charging = is_state('binary_sensor.ev_charging_active', 'on') %}
          {% if not connected %}
            Disconnected
          {% elif charging %}
            Charging
          {% elif is_state('input_boolean.ev_follow_price', 'on') and is_state('input_boolean.ev_charge_now_override', 'off') %}
            Waiting for cheap price
          {% else %}
            Ready
          {% endif %}

      # ---------------------------------------------------------------
      # Charging duration (minutes) — grows while charging is active
      # ---------------------------------------------------------------
      - name: "EV Charging Duration"
        unique_id: ev_charging_duration
        icon: mdi:timer-outline
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        state: >-
          {% set charging = is_state('binary_sensor.ev_charging_active', 'on') %}
          {% set start = states('input_datetime.ev_charge_start_time') %}
          {% if charging and start not in ['unknown', 'unavailable', ''] %}
            {{ ((now() - strptime(start, '%Y-%m-%d %H:%M:%S')).total_seconds() / 60) | round(1) }}
          {% else %}
            0
          {% endif %}

      # ---------------------------------------------------------------
      # Energy delivered this session (requires optional energy meter)
      # ---------------------------------------------------------------
      - name: "EV Charging Session Energy"
        unique_id: ev_charging_session_energy
        icon: mdi:lightning-bolt
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >-
          {% if is_state('sensor.ev_energy_meter', 'unavailable') or is_state('sensor.ev_energy_meter', 'unknown') %}
            {{ none }}
          {% else %}
            {{ [0, (states('sensor.ev_energy_meter') | float(0)) - (states('input_number.ev_charge_start_energy') | float(0))] | max | round(2) }}
          {% endif %}
        availability: "{{ states('sensor.ev_energy_meter') not in ['unknown', 'unavailable'] }}"

      # ---------------------------------------------------------------
      # Cost accrued this session (approximation: energy x avg of
      # start-price and current-price — a true Riemann integral would
      # need a dedicated integration helper, which is out of scope for
      # a lightweight package).
      # ---------------------------------------------------------------
      - name: "EV Charging Session Cost"
        unique_id: ev_charging_session_cost
        icon: mdi:cash
        device_class: monetary
        unit_of_measurement: >-
          {{ (state_attr('sensor.ev_charging_price', 'unit_of_measurement') or 'EUR/kWh') | replace('/kWh', '') }}
        state: >-
          {% set energy = states('sensor.ev_charging_session_energy') %}
          {% if energy not in ['unknown', 'unavailable', 'none', none] %}
            {% set start_price = states('input_number.ev_charge_start_price') | float(0) %}
            {% set current_price = states('sensor.ev_charging_price') | float(start_price) %}
            {{ ((energy | float(0)) * ((start_price + current_price) / 2)) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}
        availability: "{{ states('sensor.ev_charging_session_energy') not in ['unknown', 'unavailable', 'none', none] }}"

      # ---------------------------------------------------------------
      # Average price paid so far this session
      # ---------------------------------------------------------------
      - name: "EV Average Charging Price"
        unique_id: ev_average_charging_price
        icon: mdi:cash-multiple
        state: >-
          {% set energy = states('sensor.ev_charging_session_energy') | float(0) %}
          {% set cost = states('sensor.ev_charging_session_cost') %}
          {% if energy > 0 and cost not in ['unknown', 'unavailable', 'none', none] %}
            {{ ((cost | float(0)) / energy) | round(4) }}
          {% else %}
            {{ states('input_number.ev_charge_start_price') }}
          {% endif %}

      # ---------------------------------------------------------------
      # Estimated TOTAL session cost (projected to target battery %,
      # if a battery sensor, capacity and target are all configured)
      # ---------------------------------------------------------------
      - name: "EV Estimated Session Cost"
        unique_id: ev_estimated_session_cost
        icon: mdi:cash-clock
        device_class: monetary
        state: >-
          {% set capacity = states('input_number.ev_battery_capacity_kwh') | float(0) %}
          {% set target = states('input_number.ev_target_battery_percentage') | float(0) %}
          {% set session_cost = states('sensor.ev_charging_session_cost') %}
          {% set avg_price = states('sensor.ev_average_charging_price') | float(0) %}
          {% if states('sensor.ev_battery_percentage') not in ['unknown', 'unavailable'] and capacity > 0 %}
            {% set current_pct = states('sensor.ev_battery_percentage') | float(0) %}
            {% set remaining_kwh = [0, ((target - current_pct) / 100) * capacity] | max %}
            {{ ((session_cost | float(0)) + (remaining_kwh * avg_price)) | round(2) }}
          {% else %}
            {{ session_cost }}
          {% endif %}
        availability: "{{ states('sensor.ev_charging_session_cost') not in ['unknown', 'unavailable', 'none', none] }}"

      # ---------------------------------------------------------------
      # Lifetime accumulators — feed the utility_meter helpers above and
      # remain compatible with the HA Energy Dashboard.
      # ---------------------------------------------------------------
      - name: "EV Lifetime Energy"
        unique_id: ev_charging_lifetime_energy
        icon: mdi:counter
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "{{ states('input_number.ev_lifetime_energy_kwh') }}"

      - name: "EV Lifetime Cost"
        unique_id: ev_charging_lifetime_cost
        icon: mdi:cash
        device_class: monetary
        state_class: total_increasing
        state: "{{ states('input_number.ev_lifetime_cost') }}"

      - name: "EV Average Session Duration"
        unique_id: ev_average_session_duration
        icon: mdi:timer-sand
        unit_of_measurement: min
        state: >-
          {% set sessions = states('counter.ev_charging_sessions_total') | int(0) %}
          {% if sessions > 0 %}
            {{ ((states('input_number.ev_lifetime_duration_minutes') | float(0)) / sessions) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "EV Average Session Price"
        unique_id: ev_average_session_price
        icon: mdi:cash-multiple
        state: >-
          {% set energy = states('input_number.ev_lifetime_energy_kwh') | float(0) %}
          {% if energy > 0 %}
            {{ ((states('input_number.ev_lifetime_cost') | float(0)) / energy) | round(4) }}
          {% else %}
            0
          {% endif %}

      # ---------------------------------------------------------------
      # Static package version (bump alongside CHANGELOG.md / hacs.json)
      # ---------------------------------------------------------------
      - name: "EV Smart Charging Version"
        unique_id: ev_smart_charging_version
        icon: mdi:tag-outline
        state: "1.4.9"

  - binary_sensor:
      # ---------------------------------------------------------------
      # Quiet hours window (handles overnight wraparound, e.g. 22:00-06:00)
      # ---------------------------------------------------------------
      - name: "EV Quiet Hours Active"
        unique_id: ev_quiet_hours_active
        icon: mdi:sleep
        state: >-
          {% if is_state('input_boolean.ev_quiet_hours_enabled', 'off') %}
            {{ false }}
          {% else %}
            {% set now_t = now().strftime('%H:%M') %}
            {% set start = states('input_datetime.ev_quiet_hours_start')[0:5] %}
            {% set end = states('input_datetime.ev_quiet_hours_end')[0:5] %}
            {% if start < end %}
              {{ start <= now_t < end }}
            {% else %}
              {{ now_t >= start or now_t < end }}
            {% endif %}
          {% endif %}

########################################################################
# NOTIFICATION ACTION LISTENER
# Actionable-notification button presses arrive as a
# `mobile_app_notification_action` event on BOTH Android and iOS.
# This single automation dispatches them to the relevant script,
# regardless of which vehicle/blueprint instance sent the notification.
########################################################################
automation:
  - id: ev_smart_charging_notification_actions
    alias: "EV Smart Charging - Handle Notification Actions"
    description: >-
      Listens for the Charge Now / Stop Charging actionable-notification
      buttons and routes them to the matching script. Safe to trigger in
      parallel; each script instance handles its own locking.
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    conditions: []
    actions:
      - variables:
          received_action: "{{ trigger.event.data.action }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.ev_last_notification_action
        data:
          value: "{{ received_action }} @ {{ now().strftime('%H:%M:%S') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ received_action == 'EV_CHARGE_NOW' }}"
            sequence:
              - action: script.ev_charge_now
          - conditions:
              - condition: template
                value_template: "{{ received_action == 'EV_STOP_CHARGING' }}"
            sequence:
              - action: script.ev_stop_charging
