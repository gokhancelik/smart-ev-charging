########################################################################
# Smart EV Charging — Blueprint Automation
#
# This is the canonical copy, bundled inside the integration so it can be
# auto-installed on setup (see __init__.py). Don't maintain a second copy
# elsewhere in the repo — everything reads from here.
#
# Requires the companion custom_components/smart_ev_charging integration
# to be set up first (Settings > Devices & Services > + Add Integration >
# Smart EV Charging) — that's where you pick your vehicle/charger/price
# entities, once, through a normal config flow. This blueprint then reads
# the stable entity IDs the integration exposes
# (binary_sensor.ev_vehicle_connected, binary_sensor.ev_charging_active,
# binary_sensor.ev_price_cheap, sensor.ev_charging_price,
# sensor.ev_battery_percentage, sensor.ev_charging_power,
# sensor.ev_energy_meter) directly, the same way it already reads the
# package's own input_boolean/input_number helpers — no per-installation
# entity selection needed for those.
#
# The only things that genuinely differ per installation are how to
# actually start/stop your charger and which mobile device to notify,
# which is what the inputs below are for.
#
# Requires the "Smart EV Charging" package (packages/smart_ev_charging.yaml)
# to be installed, since this blueprint reads/writes its helpers and
# calls its scripts.
#
# The integration copies this file to
# <config>/blueprints/automation/smart_ev_charging/smart_ev_charging.yaml
# automatically on setup. To import manually instead: Settings >
# Automations & Scenes > Blueprints > Import Blueprint, paste:
# https://github.com/gokhancelik/smart-ev-charging/blob/master/custom_components/smart_ev_charging/blueprint/smart_ev_charging.yaml
########################################################################
blueprint:
  name: Smart EV Charging
  description: >
    Smart, price-aware EV charging for any vehicle/charger. Waits for
    cheap electricity before charging, sends actionable mobile
    notifications, and stops automatically when price rises or the
    target battery level is reached. Requires the companion Smart EV
    Charging integration (entity configuration) and package (helpers,
    sensors, scripts) to be installed first.
  domain: automation
  source_url: https://github.com/gokhancelik/smart-ev-charging/blob/master/custom_components/smart_ev_charging/blueprint/smart_ev_charging.yaml
  input:
    start_charging_action:
      name: Start Charging Action
      description: Action(s) to run to start charging your vehicle.
      selector:
        action: {}

    stop_charging_action:
      name: Stop Charging Action
      description: Action(s) to run to stop charging your vehicle.
      selector:
        action: {}

    notify_targets:
      name: Notify Devices
      description: >
        One or more mobile devices (Android or iOS, running the Home
        Assistant Companion App) to send charging notifications to. Add
        more than one to notify multiple phones/tablets — tapping an
        actionable button (Charge now / Stop charging) on any of them
        works the same way. Requires Home Assistant 2026.5 or newer.
      selector:
        device:
          multiple: true
          filter:
            integration: mobile_app

    deadline_lead_time_minutes:
      name: Departure Deadline Lead Time (minutes)
      description: >
        If the vehicle is still waiting for a cheap price this many
        minutes before departure time, charging starts immediately
        regardless of price.
      default: 120
      selector:
        number:
          min: 0
          max: 720
          step: 5
          unit_of_measurement: min

variables:
  vehicle_connected: binary_sensor.ev_vehicle_connected
  charging_active: binary_sensor.ev_charging_active
  battery_percentage: sensor.ev_battery_percentage
  energy_meter: sensor.ev_energy_meter
  current_price: sensor.ev_charging_price
  cheap_price: binary_sensor.ev_price_cheap
  notify_targets: !input notify_targets
  deadline_lead_time_minutes: !input deadline_lead_time_minutes

triggers:
  # 1. Cable plugged in
  - id: connected
    trigger: state
    entity_id: binary_sensor.ev_vehicle_connected
    to: "on"

  # 2. Cable unplugged
  - id: disconnected
    trigger: state
    entity_id: binary_sensor.ev_vehicle_connected
    to: "off"

  # 3. Price becomes cheap
  - id: price_cheap
    trigger: state
    entity_id: binary_sensor.ev_price_cheap
    to: "on"

  # 4. Price becomes expensive
  - id: price_expensive
    trigger: state
    entity_id: binary_sensor.ev_price_cheap
    to: "off"

  # 5. Charger reports charging has actually started (may be triggered by
  #    us, or externally e.g. someone plugged in and started manually)
  - id: charging_started
    trigger: state
    entity_id: binary_sensor.ev_charging_active
    to: "on"

  # 6. Charger reports charging has actually stopped
  - id: charging_stopped
    trigger: state
    entity_id: binary_sensor.ev_charging_active
    to: "off"

  # 7. Battery percentage updates (only relevant if target-% stop enabled)
  - id: battery_update
    trigger: state
    entity_id: sensor.ev_battery_percentage

  # 8. Periodic check for departure deadline / low battery emergency
  - id: periodic_check
    trigger: time_pattern
    minutes: "/10"

  # 8b. "Charge now" pressed (dashboard button or notification action)
  - id: manual_charge_now
    trigger: state
    entity_id: input_boolean.ev_charge_now_override
    to: "on"

  # 8c. "Stop charging" pressed (dashboard button or notification action)
  - id: manual_stop_requested
    trigger: state
    entity_id: input_boolean.ev_stop_charging_requested
    to: "on"

  # 9. Catch up gracefully after a Home Assistant restart
  - id: ha_restart
    trigger: homeassistant
    event: start

  # 10. Refresh the live "charging" notification periodically
  - id: notification_refresh
    trigger: time_pattern
    minutes: "/5"

conditions: []

actions:
  - choose:
      # -----------------------------------------------------------------
      # Vehicle connected: notify, seed session helpers, check overrides
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: connected
        sequence:
          - action: script.ev_notify_plugged_in
            data:
              notify_targets: "{{ notify_targets }}"

      # -----------------------------------------------------------------
      # Vehicle disconnected: clear session-only override
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: disconnected
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_charge_now_override
          - action: script.ev_debug_log
            data:
              message: "Vehicle disconnected"

      # -----------------------------------------------------------------
      # Price became cheap: start charging if conditions are met
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: price_cheap
          - condition: state
            entity_id: binary_sensor.ev_vehicle_connected
            state: "on"
          - condition: state
            entity_id: input_boolean.ev_follow_price
            state: "on"
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "off"
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.ev_max_price_enabled', 'off')
                 or (states(current_price) | float(0)) <= (states('input_number.ev_max_acceptable_price') | float(1000)) }}
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.ev_target_battery_enabled', 'off')
                 or states(battery_percentage) in ['unknown', 'unavailable']
                 or (states(battery_percentage) | float(0)) < (states('input_number.ev_target_battery_percentage') | float(100)) }}
        sequence:
          - action: script.ev_debug_log
            data:
              message: "Starting: price is cheap ({{ states(current_price) }})"
          - choose:
              default: !input start_charging_action

      # -----------------------------------------------------------------
      # Price became expensive: stop charging if we are the ones charging
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: price_expensive
          - condition: state
            entity_id: input_boolean.ev_follow_price
            state: "on"
          - condition: state
            entity_id: input_boolean.ev_charge_now_override
            state: "off"
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "on"
        sequence:
          - action: script.ev_debug_log
            data:
              message: "Stopping: price is no longer cheap ({{ states(current_price) }})"
          - choose:
              default: !input stop_charging_action

      # -----------------------------------------------------------------
      # Charging actually started: seed session data (idempotent) and
      # send the persistent "charging" notification.
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: charging_started
        sequence:
          - action: script.ev_notify_charging_started
            data:
              notify_targets: "{{ notify_targets }}"

      # -----------------------------------------------------------------
      # Charging actually stopped: dismiss notification, log session
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: charging_stopped
        sequence:
          - action: script.ev_notify_charging_finished
            data:
              notify_targets: "{{ notify_targets }}"

      # -----------------------------------------------------------------
      # Battery reached target while charging: stop
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: battery_update
          - condition: template
            value_template: "{{ states(battery_percentage) not in ['unknown', 'unavailable'] }}"
          - condition: state
            entity_id: input_boolean.ev_target_battery_enabled
            state: "on"
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "on"
          - condition: template
            value_template: >-
              {{ (states(battery_percentage) | float(0)) >= (states('input_number.ev_target_battery_percentage') | float(100)) }}
        sequence:
          - action: script.ev_debug_log
            data:
              message: "Stopping: target battery percentage reached ({{ states(battery_percentage) }}%)"
          - choose:
              default: !input stop_charging_action

      # -----------------------------------------------------------------
      # Periodic check: low-battery emergency override + departure deadline
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: periodic_check
          - condition: state
            entity_id: binary_sensor.ev_vehicle_connected
            state: "on"
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "off"
        sequence:
          - choose:
              # Low battery emergency: bypass smart waiting entirely
              - conditions:
                  - condition: state
                    entity_id: input_boolean.ev_low_battery_emergency_enabled
                    state: "on"
                  - condition: template
                    value_template: "{{ states(battery_percentage) not in ['unknown', 'unavailable'] }}"
                  - condition: template
                    value_template: >-
                      {{ (states(battery_percentage) | float(100)) <= (states('input_number.ev_low_battery_threshold') | float(0)) }}
                sequence:
                  - action: script.ev_debug_log
                    data:
                      message: "Starting: low battery emergency ({{ states(battery_percentage) }}%)"
                  - choose:
                      default: !input start_charging_action

              # Departure deadline approaching: force start regardless of price
              - conditions:
                  - condition: state
                    entity_id: input_boolean.ev_follow_price
                    state: "on"
                  - condition: template
                    value_template: >-
                      {% set cal = state_attr('sensor.ev_smart_charging_config', 'departure_calendar_entity') %}
                      {% if cal and state_attr(cal, 'start_time') %}
                        {% set next_dep = strptime(state_attr(cal, 'start_time'), '%Y-%m-%d %H:%M:%S') %}
                        {{ ((next_dep - now()).total_seconds() / 60) <= (deadline_lead_time_minutes | float(120)) }}
                      {% else %}
                        {% set dep = states('input_datetime.ev_departure_time') %}
                        {% if dep in ['unknown', 'unavailable', ''] %}
                          {{ false }}
                        {% else %}
                          {% set today_dep = today_at(dep) %}
                          {% set next_dep = today_dep if today_dep > now() else today_dep + timedelta(days=1) %}
                          {{ ((next_dep - now()).total_seconds() / 60) <= (deadline_lead_time_minutes | float(120)) }}
                        {% endif %}
                      {% endif %}
                sequence:
                  - action: script.ev_debug_log
                    data:
                      message: "Starting: departure deadline approaching"
                  - choose:
                      default: !input start_charging_action

      # -----------------------------------------------------------------
      # Periodic refresh of the live "charging" notification so battery
      # %, duration, energy and price stay current while plugged in.
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: notification_refresh
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "on"
        sequence:
          - action: script.ev_notify_charging_started
            data:
              notify_targets: "{{ notify_targets }}"

      # -----------------------------------------------------------------
      # Manual "Charge now" request: bypass price checks entirely
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: manual_charge_now
          - condition: state
            entity_id: binary_sensor.ev_vehicle_connected
            state: "on"
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "off"
        sequence:
          - action: script.ev_debug_log
            data:
              message: "Starting: manual 'Charge now' request"
          - choose:
              default: !input start_charging_action

      # -----------------------------------------------------------------
      # Manual "Stop charging" request. Always resets the request pulse,
      # even if charging was not actually active (button pressed twice).
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: manual_stop_requested
        sequence:
          - if:
              - condition: state
                entity_id: binary_sensor.ev_charging_active
                state: "on"
            then:
              - action: script.ev_debug_log
                data:
                  message: "Stopping: manual 'Stop charging' request"
              - choose:
                  default: !input stop_charging_action
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_stop_charging_requested

      # -----------------------------------------------------------------
      # Home Assistant restart: if charging is already active but our
      # session helpers were never seeded (e.g. HA restarted mid-session),
      # back-fill them without sending a duplicate notification.
      # -----------------------------------------------------------------
      - conditions:
          - condition: trigger
            id: ha_restart
          - condition: state
            entity_id: binary_sensor.ev_charging_active
            state: "on"
          - condition: state
            entity_id: input_boolean.ev_session_tracking
            state: "off"
        sequence:
          - action: script.ev_seed_session_helpers

mode: queued
max: 10
