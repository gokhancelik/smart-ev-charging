########################################################################
# Smart EV Charging — Scripts
#
# Merge this file with: script: !include_dir_merge_named scripts
#
# These scripts contain all reusable notification-building and
# session-bookkeeping logic so the blueprint automation and dashboard
# buttons stay thin and free of duplicated logic. Notifications only
# use fields supported by BOTH the Android and iOS Home Assistant
# Companion apps; a few Android-only convenience keys (channel,
# sticky) are included but are silently ignored on iOS.
########################################################################

# ------------------------------------------------------------------
# Internal: record the automation's latest decision for the debug
# dashboard section, and optionally mirror it to the Logbook when
# input_boolean.ev_debug_logging is enabled. Centralizing this avoids
# duplicating the same two-step logic at every decision point in the
# blueprint.
# ------------------------------------------------------------------
ev_debug_log:
  alias: "EV - Debug Log"
  mode: parallel
  max: 20
  fields:
    message:
      description: Human-readable decision text.
      example: "Starting: price is cheap (0.18)"
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.ev_last_charging_decision
      data:
        value: "{{ message }}"
    - if:
        - condition: state
          entity_id: input_boolean.ev_debug_logging
          state: "on"
      then:
        - action: logbook.log
          data:
            name: "Smart EV Charging"
            message: "{{ message }}"
            entity_id: input_text.ev_last_charging_decision

# ------------------------------------------------------------------
# Internal: send the same notification to one or more notify devices.
# notify_targets holds device IDs picked via the blueprint's device
# selector (always a list; a bare string is tolerated too, e.g. if
# someone calls this script by hand).
#
# The modern notify.send_message action (HA 2026.5+) fans out to many
# devices via device_id but only accepts message/title — a nested "data"
# payload (tag, actions, channel, ...) is rejected with "extra keys not
# allowed @ data['data']". The companion-app notifications this package
# relies on (update-in-place tags, actionable buttons) need that payload,
# so each device is resolved to its legacy mobile_app notify service
# (notify.mobile_app_<device>), which still accepts data. Services are
# derived from the device's mobile_app notify *entity* via the entity
# registry (integration_entities) rather than string surgery, and each
# guess is validated against the registered services, so a wrong guess
# degrades to the notify.send_message fallback below instead of failing
# the run. If a device can't be resolved, message/title are sent via
# notify.send_message as a best-effort fallback.
# ------------------------------------------------------------------
ev_send_notification:
  alias: "EV - Send Notification"
  mode: parallel
  max: 10
  fields:
    notify_targets:
      description: One or more mobile_app device IDs to send to.
      example: "3fae6...device_id"
    title:
      description: Notification title (omit for control messages like clear_notification).
      example: "⚡ Charging"
    message:
      description: Notification message or command.
      example: "Charging is scheduled for the next cheap electricity period."
    notification_data:
      description: The nested "data" payload (tag, actions, channel, ...).
      example: '{"tag": "ev_charging"}'
  sequence:
    - variables:
        targets: "{{ [notify_targets] if notify_targets is string else notify_targets }}"
        target_services: >-
          {% set ns = namespace(services=[]) %}
          {% set mobile_notify = integration_entities('mobile_app') | select('search', '^notify\\.') | list %}
          {% for device_id in targets %}
            {% for entity in device_entities(device_id) %}
              {% if entity in mobile_notify %}
                {% set svc = entity | regex_replace('^notify\\.', '') %}
                {% if svc.startswith('mobile_app_') and has_service('notify', svc) %}
                  {% set ns.services = ns.services + ['notify.' ~ svc] %}
                {% endif %}
              {% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.services | unique | list }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ (target_services | length) > 0 }}"
          sequence:
            - repeat:
                for_each: "{{ target_services }}"
                sequence:
                  - action: "{{ repeat.item }}"
                    data:
                      title: "{{ title | default('') }}"
                      message: "{{ message }}"
                      data: "{{ notification_data | default({}) }}"
        - conditions:
            - condition: template
              value_template: "{{ (target_services | length) == 0 }}"
          sequence:
            - action: notify.send_message
              target:
                device_id: "{{ targets }}"
              data:
                title: "{{ title | default('') }}"
                message: "{{ message }}"

# ------------------------------------------------------------------
# Internal: seed session tracking helpers exactly once per session
# ------------------------------------------------------------------
ev_seed_session_helpers:
  alias: "EV - Seed Session Helpers"
  mode: single
  sequence:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.ev_charge_start_time
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.ev_charge_start_energy
      data:
        value: >-
          {{ states('sensor.ev_energy_meter') | float(0) if states('sensor.ev_energy_meter') not in ['unknown', 'unavailable'] else 0 }}
    - action: input_number.set_value
      target:
        entity_id: input_number.ev_charge_start_price
      data:
        value: "{{ states('sensor.ev_charging_price') | float(0) }}"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_session_tracking

# ------------------------------------------------------------------
# Vehicle plugged in
# ------------------------------------------------------------------
ev_notify_plugged_in:
  alias: "EV - Notify Plugged In"
  mode: single
  fields:
    notify_targets:
      description: One or more mobile_app device IDs to send to.
      example: "3fae6...device_id"
  sequence:
    - choose:
        # Manual mode: skip the "waiting" notification, start right away
        - conditions:
            - condition: state
              entity_id: input_boolean.ev_follow_price
              state: "off"
          sequence:
            - action: script.ev_debug_log
              data:
                message: "Manual mode: charging immediately on plug-in"
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.ev_charge_now_override

        # Quiet hours: stay silent, smart charging still runs normally
        - conditions:
            - condition: state
              entity_id: binary_sensor.ev_quiet_hours_active
              state: "on"
          sequence:
            - action: script.ev_debug_log
              data:
                message: "Plugged in during quiet hours - notification suppressed"
      default:
        - action: script.ev_send_notification
          data:
            notify_targets: "{{ notify_targets }}"
            title: "🔌 EV plugged in"
            message: "Charging is scheduled for the next cheap electricity period."
            notification_data:
              tag: ev_charging
              channel: "EV Charging"
              actions:
                - action: "EV_CHARGE_NOW"
                  title: "⚡ Charge now"

# ------------------------------------------------------------------
# Charging started / periodic refresh while charging
# ------------------------------------------------------------------
ev_notify_charging_started:
  alias: "EV - Notify Charging Started / Refresh"
  # queued, not single: this script is driven by BOTH the charging_started
  # trigger and a 5-minute refresh trigger; overlapping runs would otherwise
  # log "already running" warnings.
  mode: queued
  fields:
    notify_targets:
      description: One or more mobile_app device IDs to send to.
      example: "3fae6...device_id"
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.ev_session_tracking
          state: "off"
      then:
        - action: script.ev_seed_session_helpers
    - variables:
        duration_min: "{{ states('sensor.ev_charging_duration') | float(0) | round(0, 'floor') | int }}"
        message: |-
          🔋 Battery: {{ (states('sensor.ev_battery_percentage') + '%') if states('sensor.ev_battery_percentage') not in ['unknown', 'unavailable'] else 'n/a' }}
          💶 Price: {{ states('sensor.ev_charging_price') }} {{ state_attr('sensor.ev_charging_price', 'unit_of_measurement') or '' }}
          🕒 Started: {{ as_timestamp(states('input_datetime.ev_charge_start_time')) | timestamp_custom('%H:%M', true) }}
          ⏱ Duration: {{ '%02d:%02d' | format(duration_min // 60, duration_min % 60) }}
          ⚡ Power: {{ (states('sensor.ev_charging_power') + ' kW') if states('sensor.ev_charging_power') not in ['unknown', 'unavailable'] else 'n/a' }}
          🔌 Energy added: {{ states('sensor.ev_charging_session_energy') if states('sensor.ev_charging_session_energy') not in ['unknown', 'unavailable', 'none', none] else 'n/a' }} kWh
    - action: script.ev_send_notification
      data:
        notify_targets: "{{ notify_targets }}"
        title: "⚡ Charging"
        message: "{{ message }}"
        notification_data:
          tag: ev_charging
          channel: "EV Charging"
          sticky: true
          persistent: true
          actions:
            - action: "EV_STOP_CHARGING"
              title: "⏹ Stop charging"

# ------------------------------------------------------------------
# Charging finished
# ------------------------------------------------------------------
ev_notify_charging_finished:
  alias: "EV - Notify Charging Finished"
  mode: single
  fields:
    notify_targets:
      description: One or more mobile_app device IDs to send to.
      example: "3fae6...device_id"
  sequence:
    - if:
        - condition: state
          entity_id: input_boolean.ev_session_tracking
          state: "off"
      then:
        - stop: "No tracked session to finish."
    - variables:
        energy_added: "{{ states('sensor.ev_charging_session_energy') | float(0) }}"
        # ev_charging_duration is gated on charging being active, which has
        # already flipped off by the time this script runs (charging_stopped
        # trigger). Compute the elapsed time from the seeded start datetime
        # instead, so duration is never recorded as 0.
        duration_min: >-
          {% set start = states('input_datetime.ev_charge_start_time') %}
          {% if start not in ['unknown', 'unavailable', ''] %}
            {{ ((now() - strptime(start, '%Y-%m-%d %H:%M:%S')).total_seconds() / 60) | round(0, 'floor') | int }}
          {% else %}
            0
          {% endif %}
        avg_price: "{{ states('sensor.ev_average_charging_price') | float(0) }}"
        price_unit: "{{ (state_attr('sensor.ev_charging_price', 'unit_of_measurement') or 'EUR/kWh') }}"
    # Dismiss the persistent charging notification (works on both platforms)
    - action: script.ev_send_notification
      continue_on_error: true
      data:
        notify_targets: "{{ notify_targets }}"
        message: "clear_notification"
        notification_data:
          tag: ev_charging
    # Optional summary notification (skipped during quiet hours or no-op sessions)
    - if:
        - condition: state
          entity_id: binary_sensor.ev_quiet_hours_active
          state: "off"
        - condition: template
          value_template: "{{ energy_added > 0 }}"
      then:
        - action: script.ev_send_notification
          continue_on_error: true
          data:
            notify_targets: "{{ notify_targets }}"
            title: "✅ Charging finished"
            message: |-
              🔋 Added {{ energy_added | round(1) }} kWh
              ⏱ Duration {{ duration_min // 60 }}h {{ duration_min % 60 }}m
              💶 Average charging price {{ avg_price | round(3) }} {{ price_unit }}
            notification_data:
              tag: ev_charging_summary
              channel: "EV Charging"
    - action: script.ev_log_charging_session
      data:
        energy_added: "{{ energy_added }}"
        duration_minutes: "{{ duration_min }}"
        avg_price: "{{ avg_price }}"

# ------------------------------------------------------------------
# Internal: persist session statistics and reset session tracking
# ------------------------------------------------------------------
ev_log_charging_session:
  alias: "EV - Log Charging Session"
  mode: queued
  fields:
    energy_added:
      description: Energy delivered this session, in kWh.
      example: 18.4
    duration_minutes:
      description: Session duration in minutes.
      example: 155
    avg_price:
      description: Average price paid this session.
      example: 0.17
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.ev_lifetime_energy_kwh
      data:
        value: "{{ (states('input_number.ev_lifetime_energy_kwh') | float(0)) + (energy_added | float(0)) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.ev_lifetime_cost
      data:
        value: "{{ (states('input_number.ev_lifetime_cost') | float(0)) + ((energy_added | float(0)) * (avg_price | float(0))) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.ev_lifetime_duration_minutes
      data:
        value: "{{ (states('input_number.ev_lifetime_duration_minutes') | float(0)) + (duration_minutes | float(0)) }}"
    - action: counter.increment
      target:
        entity_id: counter.ev_charging_sessions_total
    - action: input_text.set_value
      target:
        entity_id: input_text.ev_last_session_summary
      data:
        value: >-
          {{ (energy_added | float(0)) | round(1) }} kWh · {{ (duration_minutes | int(0)) // 60 }}h {{ (duration_minutes | int(0)) % 60 }}m · {{ (avg_price | float(0)) | round(3) }}/kWh · {{ now().strftime('%H:%M') }}
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_session_tracking

# ------------------------------------------------------------------
# Dashboard / notification button entry points
# ------------------------------------------------------------------
ev_charge_now:
  alias: "EV - Charge Now"
  mode: single
  sequence:
    # Pulse the override so a repeat press always produces a state edge for
    # the blueprint's manual_charge_now trigger (it only fires on to: "on").
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_charge_now_override
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_charge_now_override

ev_stop_charging:
  alias: "EV - Stop Charging"
  mode: single
  sequence:
    # Pulse the request so a repeat press always produces a state edge for
    # the blueprint's manual_stop_requested trigger (it only fires on to: "on").
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_stop_charging_requested
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_stop_charging_requested

ev_enable_smart_charging:
  alias: "EV - Enable Smart Charging"
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_follow_price
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_charge_now_override

ev_disable_smart_charging:
  alias: "EV - Disable Smart Charging"
  mode: single
  sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_follow_price
